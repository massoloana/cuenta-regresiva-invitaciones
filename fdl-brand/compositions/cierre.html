<template>

    @font-face { font-family: "Comfortaa"; font-weight: 400; src: url("assets/fonts/comfortaa-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Comfortaa"; font-weight: 500; src: url("assets/fonts/comfortaa-latin-500-normal.woff2") format("woff2"); }
    #root {
      position: absolute;
      inset: 0;
      font-family: "Comfortaa", sans-serif;
      color: #17151f;
    }
    #ci-ground {
      position: absolute;

    #ci-mark {
      position: absolute;

    #ci-shadow {
      position: absolute;

  <div id="root" data-composition-id="cierre" data-width="1920" data-height="1080">

    <div id="ci-mark">
      <div id="ci-shadow"></div>
      <div id="ci-spin">
        <img class="ci-depth" src="assets/logo-3d.png" alt="" style="transform: translateZ(-8px)" />
        <img class="ci-depth" src="assets/logo-3d.png" alt="" style="transform: translateZ(-6px)" />

        <img class="ci-depth" src="assets/logo-3d.png" alt="" style="transform: translateZ(-2px)" />
        <img class="ci-depth" src="assets/logo-3d.png" alt="" style="transform: translateZ(0px)" />

  <script>
    const tl = gsap.timeline({ paused: true });

    // The 3D mark turns into place: one and a half revolutions, settling on a long tail
    // (opacity goes on the wrapper: opacity on the 3D element itself would flatten it)
    tl.fromTo("#ci-spin", { rotationY: -540, scale: 0.82 }, { rotationY: 0, scale: 1, duration: 2.2, ease: "expo.out" }, 0.15);
    tl.fromTo("#ci-mark", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.15);
    tl.fromTo("#ci-shadow", { opacity: 0, scaleX: 0.5 }, { opacity: 1, scaleX: 1, duration: 1.6, ease: "power2.out" }, 0.4);
    // solid edge and back face only while it turns
    tl.set(["#ci-back", "#ci-mark .ci-depth"], { opacity: 0 }, 2.0);

    // Wordmark, word by word (light grey to ink)
    tl.fromTo("#ci-w1", { opacity: 0, color: "#c9c7d3", filter: "blur(6px)" }, { opacity: 1, color: "#17151f", filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 0.95);
    tl.fromTo("#ci-w2", { opacity: 0, color: "#c9c7d3", filter: "blur(6px)" }, { opacity: 1, color: "#17151f", filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 1.15);
    tl.fromTo("#ci-w3", { opacity: 0, color: "#c9c7d3", filter: "blur(6px)" }, { opacity: 1, color: "#17151f", filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 1.35);

    // Signature rule draws from the centre
    tl.fromTo("#ci-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.out" }, 1.8);

    window.__timelines["cierre"] = tl;
  </script>
