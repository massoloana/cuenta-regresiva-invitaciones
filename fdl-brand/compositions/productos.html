  <script>
    // Split titles into letters (synchronous, before the timeline is built)
    document.querySelectorAll('[data-composition-id="productos"] .pr-split').forEach((el) => {
      const text = el.textContent;
      el.textContent = "";
      for (const c of text) {
        const s = document.createElement("span");
        s.className = "ch";
        s.style.display = "inline-block";
        s.textContent = c === " " ? " " : c;
        el.appendChild(s);
      }
    });

    const tl = gsap.timeline({ paused: true });

    // Opener
    tl.fromTo("#pr-tag", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 0.2);
    tl.fromTo("#pr-intro-eyebrow", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 0.25);
    tl.fromTo("#pr-intro-title .ch", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out", stagger: 0.045 }, 0.4);
    tl.fromTo("#pr-intro-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out" }, 1.0);
    tl.to("#pr-intro", { opacity: 0, y: -30, filter: "blur(10px)", duration: 0.35, ease: "power3.in" }, 2.15);

    // Stage
    tl.fromTo("#pr-disc", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.0, ease: "expo.out" }, 2.4);
    tl.fromTo("#pr-floor", { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.9, ease: "power2.out" }, 2.55);

    // One beat per product: it lands on the stage, then its name; then it leaves to the left as the next arrives
    const BEAT = 3.1;
    const FIRST = 2.55;
    for (let i = 1; i <= 4; i++) {
      const t = FIRST + (i - 1) * BEAT;
      const p = `#pr-p${i}`;
      const c = `#pr-c${i}`;
      tl.fromTo(p, { opacity: 0, x: 180, scale: 0.94, filter: "blur(12px)" }, { opacity: 1, x: 0, scale: 1, filter: "blur(0px)", duration: 1.0, ease: "expo.out" }, t);
      tl.fromTo(`${c} .pr-num`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, t + 0.2);
      tl.fromTo(`${c} .ch`, { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out", stagger: 0.035 }, t + 0.3);
      tl.fromTo(`${c} .pr-rule`, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, t + 0.65);
      tl.fromTo(`${c} .pr-kind`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, t + 0.75);

      // exit
      const out = t + BEAT - 0.4;
      tl.to(p, { opacity: 0, x: -180, filter: "blur(10px)", duration: 0.4, ease: "power3.in" }, out);
      tl.to(c, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, out);
    }
    // Porta control: the back plate settles a beat after the main view
    tl.fromTo("#pr-p3-back", { x: 60, y: 20 }, { x: 0, y: 0, duration: 1.1, ease: "expo.out" }, FIRST + 2 * BEAT + 0.15);

    // Stage clears for the closing
    const END = FIRST + 4 * BEAT - 0.4;
    tl.to(["#pr-disc", "#pr-floor"], { opacity: 0, scale: 0.85, duration: 0.4, ease: "power3.in" }, END);
    tl.to("#pr-tag", { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, END);

    window.__timelines["productos"] = tl;
  </script>
