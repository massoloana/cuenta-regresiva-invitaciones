  <script>
    const tl = gsap.timeline({ paused: true });

    // Opener: copy on the left, the phone rises into the frame on the right
    tl.fromTo("#vd-tag", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 0.2);
    tl.fromTo("#vd-eyebrow i", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.25);
    tl.fromTo("#vd-eyebrow span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, 0.35);
    tl.fromTo("#vd-title .ch", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out", stagger: 0.06 }, 0.5);
    tl.fromTo("#vd-disc", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.0, ease: "expo.out" }, 0.6);
    tl.fromTo("#vd-phone", { y: 900, rotation: 8 }, { y: 0, rotation: 0, duration: 1.3, ease: "expo.out" }, 0.75);

    // Before the first video starts the screen is still black; slot 2 waits below the screen
    tl.fromTo("#vd-s2", { yPercent: 100 }, { yPercent: 100, duration: 0.01 }, 0);

    const INFO_IN = (i, t) => {
      tl.fromTo(`${i} .vd-num`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, t);
      tl.fromTo(`${i} .vd-name`, { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, t + 0.1);
      tl.fromTo(`${i} .vd-rule`, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, t + 0.35);
    };
    INFO_IN("#vd-i1", 2.2);

    // Swipe up to the next video, like a reel
    const SWIPE = 39.1;
    tl.to("#vd-s1", { yPercent: -100, duration: 0.5, ease: "power3.inOut" }, SWIPE);
    tl.to("#vd-s2", { yPercent: 0, duration: 0.5, ease: "power3.inOut" }, SWIPE);
    tl.to("#vd-i1", { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, SWIPE);
    INFO_IN("#vd-i2", SWIPE + 0.35);

    // Out: the phone drops away as the second video ends
    const END = 98.3;
    tl.to("#vd-phone", { y: 900, rotation: -6, duration: 0.6, ease: "power3.in" }, END);
    tl.to("#vd-disc", { opacity: 0, scale: 0.85, duration: 0.45, ease: "power3.in" }, END + 0.1);
    tl.to(["#vd-i2", "#vd-title", "#vd-eyebrow", "#vd-tag"], { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in", stagger: 0.04 }, END);

    window.__timelines["videos"] = tl;
