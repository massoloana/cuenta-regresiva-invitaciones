<!doctype html>
<html
  lang="es"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"brand","type":"string","label":"Marca","default":"Futuro Digital Lab"},
    {"id":"violeta","type":"color","label":"Violeta","default":"#8034CC"},
    {"id":"azul","type":"color","label":"Azul","default":"#476EE3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Comfortaa"; font-weight: 400; src: url("assets/fonts/comfortaa-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Comfortaa"; font-weight: 600; src: url("assets/fonts/comfortaa-latin-600-normal.woff2") format("woff2"); }
      :root {
        --ground: #dcdce1;
        --ink: #17151f;
        --muted: #6c6a78;
        --violeta: #8034cc;
        --azul: #476ee3;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Comfortaa", sans-serif;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 75% 70% at 50% 46%, #ececf0 0%, #dedee3 55%, #cfcfd6 100%);
      }
      #hud {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        z-index: 20;
      }
      #hud-brand {
        position: absolute;
        left: 120px;
        top: 92px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 18px;
      }
      #hud-brand i {
        display: block;
        width: 34px;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--violeta), var(--azul));
      }
      #hud-year {
        position: absolute;
        right: 120px;
        top: 92px;
        font-size: 20px;
        font-weight: 400;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #5d5b68;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>

      <div
        id="logo"
        data-composition-id="logo"
        data-composition-src="compositions/logo.html"
        data-start="0"
        data-duration="10.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <div
        id="tipografia"
        data-composition-id="tipografia"
        data-composition-src="compositions/tipografia.html"
        data-start="10.5"
        data-duration="6.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>

      <div
        id="paleta"
        data-composition-id="paleta"
        data-composition-src="compositions/paleta.html"
        data-start="16.8"
        data-duration="6.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>

      <div
        id="cierre"
        data-composition-id="cierre"
        data-composition-src="compositions/cierre.html"
        data-start="23.0"
        data-duration="6.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>

      <div id="hud" class="clip" data-start="0" data-duration="22" data-track-index="2" data-track-kind="graphics">
        <div id="hud-brand"><i></i><span data-var-text="brand">Futuro Digital Lab</span></div>
        <div id="hud-year">Identidad visual</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hud-brand", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 0.3);
      tl.fromTo("#hud-year", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 0.45);
      tl.to(["#hud-brand", "#hud-year"], { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, 21.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
