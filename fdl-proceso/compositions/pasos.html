<template>
  <style>
    @font-face { font-family: "Comfortaa"; font-weight: 400; src: url("assets/fonts/comfortaa-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Comfortaa"; font-weight: 600; src: url("assets/fonts/comfortaa-latin-600-normal.woff2") format("woff2"); }
    #root {
      position: absolute;

    }

    /* Photo cards: printed-photo look, dropped one on top of the other */
    .ps-card {
      position: absolute;

      box-shadow: 0 30px 60px -24px rgba(40, 28, 90, 0.38), 0 6px 18px rgba(40, 28, 90, 0.12);

    #ps-k1 { left: 1050px; top: 170px; width: 568px; height: 748px; }
    #ps-k2 { left: 1070px; top: 166px; width: 568px; height: 748px; }

    /* Copy (left column) */
    .ps-copy {
      position: absolute;
      left: 160px;
      top: 0;
      width: 660px;
      height: 1080px;
    }
    .ps-num {
      position: absolute;
      left: 0;
      top: 360px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #7c33c6;
    }
    .ps-num span { color: #6c6a78; font-weight: 400; }
    .ps-title {
      position: absolute;
      left: -3px;
      top: 410px;
      width: 660px;
      font-size: 76px;
      font-weight: 600;
      line-height: 1.12;
    }
    .ps-rule {
      position: absolute;
      left: 0;
      width: 120px;
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(90deg, #8034cc, #476ee3);
      transform-origin: left center;
    }
    .ps-desc {
      position: absolute;
      left: 0;
      width: 620px;
      font-size: 32px;

    .ps-tag {
      position: absolute;
      left: 120px;
      bottom: 92px;
      display: flex;
      align-items: baseline;
      gap: 16px;
      font-size: 22px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .ps-tag b { font-weight: 600; color: #7c33c6; }
    .ps-tag span { font-weight: 400; color: #4b4957; }
  </style>
  <div id="root" data-composition-id="pasos" data-width="1920" data-height="1080" data-layout-allow-overlap>
    <div class="ps-card" id="ps-k1"><div class="ps-photo"><img src="assets/fotos/referencias.jpg" alt="Análisis de referencias y paleta de color" /></div></div>
    <div class="ps-card" id="ps-k2"><div class="ps-photo"><img src="assets/fotos/tipografia.jpg" alt="Exploración tipográfica en Canva" /></div></div>
    <div class="ps-card" id="ps-k3"><div class="ps-photo"><img src="assets/fotos/logo.jpg" alt="Construcción del logo en Canva" /></div></div>
    <div class="ps-card" id="ps-k4"><div class="ps-photo"><img src="assets/fotos/prueba.jpg" alt="Prueba del portacelular" /></div></div>

    <div class="ps-copy" id="ps-c1">
      <div class="ps-num">PASO 01 <span>/ 04</span></div>
      <div class="ps-title">Investigación</div>
      <div class="ps-rule" style="top: 524px"></div>
      <div class="ps-desc" style="top: 562px">Referencias de marcas, análisis de color y armado de la paleta.</div>
    </div>
    <div class="ps-copy" id="ps-c2">
      <div class="ps-num">PASO 02 <span>/ 04</span></div>
      <div class="ps-title">Exploración tipográfica</div>
      <div class="ps-rule" style="top: 610px"></div>
      <div class="ps-desc" style="top: 648px">Pruebas de letras, volumen y perspectiva en Canva.</div>
    </div>
    <div class="ps-copy" id="ps-c3">
      <div class="ps-num">PASO 03 <span>/ 04</span></div>
      <div class="ps-title">Construcción del logo</div>
      <div class="ps-rule" style="top: 610px"></div>
      <div class="ps-desc" style="top: 648px">Isotipo y logotipo de Futuro Digital Lab, trabajados en equipo.</div>
    </div>
    <div class="ps-copy" id="ps-c4">
      <div class="ps-num">PASO 04 <span>/ 04</span></div>
      <div class="ps-title">Prueba de producto</div>
      <div class="ps-rule" style="top: 610px"></div>
      <div class="ps-desc" style="top: 648px">El portacelular, probado en uso en el aula.</div>
    </div>

    <div class="ps-tag" id="ps-tag"><b>Backstage</b><span>Proceso de trabajo</span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#ps-tag", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 0.2);

    const ROT = [-4, 3, -2, 2];
    const BEAT = 5.4;
    for (let i = 1; i <= 4; i++) {
      const t = 0.2 + (i - 1) * BEAT;
      const k = `#ps-k${i}`;
      const c = `#ps-c${i}`;
      const r = ROT[i - 1];

      // The photo drops onto the pile
      tl.fromTo(k, { opacity: 0, y: -90, scale: 1.12, rotation: r - 7, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, rotation: r, filter: "blur(0px)", duration: 0.95, ease: "expo.out" }, t);
      // a slow push inside the photo while it is on top
      tl.fromTo(`${k} img`, { scale: 1.1 }, { scale: 1.0, duration: BEAT + 0.4, ease: "none" }, t);
      // the card underneath steps back
      if (i > 1) {
        tl.to(`#ps-k${i - 1}`, { x: -60, scale: 0.94, opacity: 0.55, duration: 0.8, ease: "power3.out" }, t + 0.05);
      }
      if (i > 2) {
        tl.to(`#ps-k${i - 2}`, { opacity: 0, duration: 0.5, ease: "power2.in" }, t + 0.05);
      }

      // Copy
      tl.fromTo(`${c} .ps-num`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, t + 0.25);
      tl.fromTo(`${c} .ps-title`, { opacity: 0, y: 28, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.65, ease: "expo.out" }, t + 0.35);
      tl.fromTo(`${c} .ps-rule`, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, t + 0.65);
      tl.fromTo(`${c} .ps-desc`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, t + 0.8);
      tl.to(c, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, t + BEAT - 0.3);
    }

    // Clear the pile for the closing
    const END = 0.2 + 4 * BEAT - 0.3;
    tl.to(["#ps-k3", "#ps-k4"], { opacity: 0, y: 40, filter: "blur(10px)", duration: 0.4, ease: "power3.in", stagger: 0.05 }, END - 0.1);
    tl.to("#ps-tag", { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, END);

    window.__timelines["pasos"] = tl;
  </script>
</template>
