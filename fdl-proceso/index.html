<!doctype html>
<html
  lang="es"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"curso","type":"string","label":"Curso","default":"Realizador/a de piezas gráficas y audiovisuales para Redes Sociales"},
    {"id":"seccion","type":"string","label":"Sección","default":"Proceso"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Comfortaa"; font-weight: 400; src: url("assets/fonts/comfortaa-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Comfortaa"; font-weight: 600; src: url("assets/fonts/comfortaa-latin-600-normal.woff2") format("woff2"); }
      :root {
        --ground: #dcdce1;
        --ink: #17151f;
        --violeta: #8034cc;
        --azul: #476ee3;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Comfortaa", sans-serif;
      }
      /* Same ground as the identity film */
      #ground {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 75% 70% at 50% 46%, #ececf0 0%, #dedee3 55%, #cfcfd6 100%);
      }
      #hud {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        z-index: 20;
      }
      #hud-brand {
        position: absolute;
        left: 120px;
        top: 80px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 18px;
        white-space: nowrap;
      }
      #hud-brand i {
        display: block;
        width: 34px;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--violeta), var(--azul));
      }
      #hud-year {
        position: absolute;
        left: 172px;
        top: 124px;
        font-size: 20px;
        font-weight: 400;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #5d5b68;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31.5"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>

      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="4.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <div
        id="pasos"
        data-composition-id="pasos"
        data-composition-src="compositions/pasos.html"
        data-start="4.6"
        data-duration="22"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>

      <div
        id="cierre"
        data-composition-id="cierre"
        data-composition-src="compositions/cierre.html"
        data-start="26.6"
        data-duration="4.9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>

      <audio
        id="bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="31.5"
        data-track-index="3"
        data-volume="0.85"
      ></audio>

      <div id="hud" class="clip" data-start="4.6" data-duration="22" data-track-index="2" data-track-kind="graphics">
        <div id="hud-brand"><i></i><span data-var-text="curso">Realizador/a de piezas gráficas y audiovisuales para Redes Sociales</span></div>
        <div id="hud-year" data-var-text="seccion">Proceso</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hud-brand", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4.8);
      tl.fromTo("#hud-year", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4.95);
      tl.to(["#hud-brand", "#hud-year"], { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, 26.15);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
