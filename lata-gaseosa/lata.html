<title>Lata Rosa</title>
<style>
  /* Layout: escena WebGL a pantalla completa, solo controles de luz sin texto flotando abajo. Look oscuro único, a propósito. */
  :root {
    --bg: #140a10;
    --ink: #f7eaf0;
    --muted: #c7a5b5;
    --glass: rgba(30, 12, 22, 0.58);
    --line: rgba(255, 210, 228, 0.16);
    --accent: #ff5c9d;
        color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* acabado fotográfico: viñeta suave y grano fino encima del render */
  .grade {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.38) 100%);
  }
  .grade::after {
    content: ""; position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .controls {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    max-width: calc(100% - 32px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .seg {
    display: flex;
    padding: 5px;
    gap: 8px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  button {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    color: var(--muted);
    background: transparent;
    display: grid;
    place-items: center;
    transition: color .2s, box-shadow .2s;
  }
  .dot { background: linear-gradient(135deg, var(--c1), var(--c2)); opacity: 0.55; }
  .dot:hover { opacity: 0.85; }
  .dot[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  .icon { width: 44px; height: 44px; }
  .icon:hover { color: var(--ink); }
  .icon svg { width: 16px; height: 16px; fill: currentColor; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .solo {
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .error {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding-inline: 24px; text-align: center; color: var(--muted);
  }
</style>

<div id="stage" aria-label="Lata de gaseosa en 3D flotando sobre una tela"></div>

<div class="grade" aria-hidden="true"></div>

<div class="controls">
  <div class="seg" role="group" aria-label="Iluminación">
    <button id="p-estudio" class="dot" data-preset="estudio" aria-label="Luz de estudio" aria-pressed="true" style="--c1:#ffe6d2;--c2:#ff4f9a"></button>
    <button id="p-neon" class="dot" data-preset="neon" aria-label="Luz neón" aria-pressed="false" style="--c1:#ff2d95;--c2:#2fe3ff"></button>
    <button id="p-atardecer" class="dot" data-preset="atardecer" aria-label="Luz de atardecer" aria-pressed="false" style="--c1:#ffae66;--c2:#ff6a8a"></button>
  </div>
  <button id="spin" class="solo icon" aria-label="Pausar giro" aria-pressed="false"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const stage = document.getElementById('stage');
  if (!window.THREE || !THREE.OrbitControls) {
    stage.innerHTML = '<div class="error">No se pudo cargar three.js. Recargá la página.</div>';
    return;
  }

  // ---------- Renderer, escena, cámara ----------
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    stage.innerHTML = '<div class="error">Este navegador no tiene WebGL activado, así que no puede mostrar la escena 3D.</div>';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#140a10');
  scene.fog = new THREE.FogExp2('#140a10', 0.05);

  const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
  camera.position.set(0, 2.1, 9.8);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.65, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minDistance = 5;
  controls.maxDistance = 15;
  controls.minPolarAngle = 0.55;
  controls.maxPolarAngle = 1.52;
  controls.minAzimuthAngle = -1.1;
  controls.maxAzimuthAngle = 1.1;
  controls.update();

  // ---------- Lata (medidas reales en mm de una lata de 355 ml, escala 0.02) ----------
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  // Ruido determinístico para las texturas procedurales
  function rng(seed) {
    return () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  }

  // Convierte un mapa de alturas en un normal map (tangente)
  function heightToNormal(h, w, hh, strength, wrapX) {
    const c = document.createElement('canvas');
    c.width = w; c.height = hh;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(w, hh);
    const at = (x, y) => {
      if (wrapX) x = (x + w) % w; else x = Math.max(0, Math.min(w - 1, x));
      y = Math.max(0, Math.min(hh - 1, y));
      return h[y * w + x];
    };
    for (let y = 0; y < hh; y++) {
      for (let x = 0; x < w; x++) {
        const dx = (at(x + 1, y) - at(x - 1, y)) * strength;
        const dy = (at(x, y + 1) - at(x, y - 1)) * strength;
        const len = Math.hypot(dx, dy, 1);
        const k = (y * w + x) * 4;
        img.data[k] = (-dx / len * 0.5 + 0.5) * 255;
        img.data[k + 1] = (dy / len * 0.5 + 0.5) * 255;
        img.data[k + 2] = (1 / len * 0.5 + 0.5) * 255;
        img.data[k + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = maxAniso;
    if (wrapX) t.wrapS = THREE.RepeatWrapping;
    return t;
  }

  // Perfil exterior completo: del centro del fondo abovedado hasta el borde del panel de la tapa
  const PROFILE = [
    [0, 9.6], [6, 9.4], [12, 8.5], [17, 6.7], [20.5, 4.5], [22.6, 2.3], [23.8, 0.7],
    [25, 0], [26.2, 0.45], [28, 2.3], [30.2, 5.1], [31.9, 8.1], [32.8, 10.8], [33, 12.8],
    [33, 30], [33, 55], [33, 80], [33, 98.4],
    [32.8, 101], [32.1, 104.4], [30.7, 108.1], [29.1, 111.3], [28, 113.6], [27.55, 115.2],
    [27.6, 117], [27.95, 119.4], [27.75, 121.2], [27.15, 122], [26.35, 121.9], [25.85, 121.1],
    [25.6, 119.4], [25.25, 117], [24.7, 115.6], [24, 115.15], [23.35, 115.55], [22.8, 116.6],
  ];
  const curve = new THREE.CatmullRomCurve3(PROFILE.map(([x, y]) => new THREE.Vector3(x, y, 0)), false, 'centripetal');
  const N = 700;
  const spaced = curve.getSpacedPoints(N - 1);
  const shellGeo = new THREE.LatheGeometry(spaced.map(p => new THREE.Vector2(p.x, p.y)), 220);

  // Zonas a lo largo del perfil: pintura rosa en el cuerpo y el cuello, aluminio desnudo en fondo y costura
  const PAINT_FROM = 11.5, PAINT_TO = 113.2;
  const firstPaint = spaced.findIndex(p => p.y >= PAINT_FROM && p.x > 30);
  let lastPaint = firstPaint;
  for (let j = firstPaint; j < N && spaced[j].y <= PAINT_TO && spaced[j].x > 27.9; j++) lastPaint = j;
  const paintAt = j => {
    const soft = 3;
    const a = THREE.MathUtils.smoothstep(j, firstPaint - soft, firstPaint + soft);
    const b = 1 - THREE.MathUtils.smoothstep(j, lastPaint - soft, lastPaint + soft);
    return a * b;
  };

  // Mapas 1D (filas = posición a lo largo del perfil; canvas fila 0 = arriba = v 1)
  const PINK = [0.62, 0.075, 0.30];  // rosa oscuro (sRGB 0-1)
  const ALU = [0.86, 0.87, 0.89];
  const colorCanvas = document.createElement('canvas');
  const pbrCanvas = document.createElement('canvas');
  colorCanvas.width = pbrCanvas.width = 4;
  colorCanvas.height = pbrCanvas.height = N;
  const cctx = colorCanvas.getContext('2d'), pctx = pbrCanvas.getContext('2d');
  const cImg = cctx.createImageData(4, N), pImg = pctx.createImageData(4, N);
  for (let j = 0; j < N; j++) {
    const m = paintAt(j);
    const row = N - 1 - j;
    // pintura translúcida sobre aluminio: menos metálica y un poco más rugosa que el metal desnudo
    const rough = 0.17 + (0.3 - 0.17) * m;
    const metal = 1 + (0.72 - 1) * m;
    for (let x = 0; x < 4; x++) {
      const k = (row * 4 + x) * 4;
      cImg.data[k] = (ALU[0] + (PINK[0] - ALU[0]) * m) * 255;
      cImg.data[k + 1] = (ALU[1] + (PINK[1] - ALU[1]) * m) * 255;
      cImg.data[k + 2] = (ALU[2] + (PINK[2] - ALU[2]) * m) * 255;
      cImg.data[k + 3] = 255;
      pImg.data[k] = 0;
      pImg.data[k + 1] = rough * 255;
      pImg.data[k + 2] = metal * 255;
      pImg.data[k + 3] = 255;
    }
  }
  cctx.putImageData(cImg, 0, 0);
  pctx.putImageData(pImg, 0, 0);
  const shellColor = new THREE.CanvasTexture(colorCanvas);
  shellColor.encoding = THREE.sRGBEncoding;
  const shellPbr = new THREE.CanvasTexture(pbrCanvas);

  // Relieve: anillos de torneado en el fondo y la costura, ondulación mínima de la pared
  const shellNormal = (() => {
    const W = 512, H = N;
    const h = new Float32Array(W * H);
    const r = rng(11);
    const rings = new Float32Array(H);
    for (let j = 0; j < H; j++) rings[j] = r();
    for (let y = 0; y < H; y++) {
      const j = N - 1 - y;
      const m = paintAt(j);
      const bare = (1 - m) * (rings[y] * 0.6 + 0.4 * Math.sin(j * 2.1));
      for (let x = 0; x < W; x++) {
        const u = x / W * Math.PI * 2;
        const wobble = m * (0.35 * Math.sin(u * 3 + j * 0.011) + 0.2 * Math.sin(u * 7 + 1.3 + j * 0.02));
        h[y * W + x] = bare * 0.6 + wobble * 0.15;
      }
    }
    return heightToNormal(h, W, H, 1.2, true);
  })();

  const shellMat = new THREE.MeshPhysicalMaterial({
    map: shellColor,
    roughnessMap: shellPbr,
    metalnessMap: shellPbr,
    roughness: 1,
    metalness: 1,
    normalMap: shellNormal,
    normalScale: new THREE.Vector2(0.35, 0.35),
    clearcoat: 1,
    clearcoatRoughness: 0.045,
    envMapIntensity: 1.15,
    side: THREE.DoubleSide,
  });

  // Tapa: aluminio con marcas concéntricas de estampado, panel de apertura, nervio y hueco para el dedo
  const LID_R = 22.8;
  const lidNormal = (() => {
    const S = 1024;
    const h = new Float32Array(S * S);
    const r = rng(23);
    const rings = new Float32Array(S);
    for (let i = 0; i < S; i++) rings[i] = r();
    const bump = (d, w) => Math.exp(-(d * d) / (2 * w * w));
    for (let py = 0; py < S; py++) {
      for (let px = 0; px < S; px++) {
        // canvas → mm: x a la derecha, z hacia el frente (abajo del canvas)
        const x = (px / (S - 1) * 2 - 1) * LID_R;
        const z = (py / (S - 1) * 2 - 1) * LID_R;
        const rad = Math.hypot(x, z);
        let v = rings[Math.min(S - 1, Math.floor(rad / LID_R * S * 0.5))] * 0.08;
        v += 0.9 * bump(rad - 20.3, 0.45);                 // nervio perimetral
        v += 0.6 * bump(rad - 4.3, 0.5);                    // anillo alrededor del remache
        const f = Math.pow(Math.abs(x / 7.6), 2.6) + Math.pow(Math.abs((z - 10.6) / 7.2), 2.6);
        v += 0.35 * (1 - THREE.MathUtils.smoothstep(f, 0.85, 1.05)); // panel de apertura levemente elevado
        v -= 0.75 * bump(f - 1.06, 0.035);                  // línea de corte
        const g = Math.pow(x / 6.2, 2) + Math.pow((z + 10.4) / 4.4, 2);
        v -= 0.8 * (1 - THREE.MathUtils.smoothstep(g, 0.6, 1.2)); // hueco para el dedo
        h[py * S + px] = v;
      }
    }
    return heightToNormal(h, S, S, 2.4, false);
  })();
  const lidMat = new THREE.MeshPhysicalMaterial({
    color: 0xcfd3d8,
    metalness: 1,
    roughness: 0.27,
    normalMap: lidNormal,
    normalScale: new THREE.Vector2(0.6, 0.6),
    clearcoat: 0.5,
    clearcoatRoughness: 0.12,
    envMapIntensity: 1.1,
  });
  const tabMat = new THREE.MeshPhysicalMaterial({
    color: 0xd9dce0, metalness: 1, roughness: 0.2, clearcoat: 0.6, clearcoatRoughness: 0.08, envMapIntensity: 1.2,
  });

  const canModel = new THREE.Group();
  canModel.scale.setScalar(0.02);
  canModel.position.y = -61 * 0.02;

  canModel.add(new THREE.Mesh(shellGeo, shellMat));

  const lidGeo = new THREE.CircleGeometry(LID_R, 160);
  const lid = new THREE.Mesh(lidGeo, lidMat);
  lid.rotation.x = -Math.PI / 2;
  lid.position.y = 116.6;
  canModel.add(lid);

  // Anilla: cuerpo con nariz delantera, aro trasero y bordes redondeados
  const tabShape = new THREE.Shape();
  tabShape.moveTo(-4.2, -4.6);
  tabShape.quadraticCurveTo(0, -6.4, 4.2, -4.6);
  tabShape.bezierCurveTo(6.6, -2, 7.2, 4, 7.2, 8);
  tabShape.bezierCurveTo(7.2, 13.2, 4.2, 15.4, 0, 15.4);
  tabShape.bezierCurveTo(-4.2, 15.4, -7.2, 13.2, -7.2, 8);
  tabShape.bezierCurveTo(-7.2, 4, -6.6, -2, -4.2, -4.6);
  const ring = new THREE.Path();
  ring.moveTo(0, 4.6);
  ring.bezierCurveTo(3.4, 4.6, 4.6, 6.6, 4.6, 8.9);
  ring.bezierCurveTo(4.6, 11.4, 2.8, 12.6, 0, 12.6);
  ring.bezierCurveTo(-2.8, 12.6, -4.6, 11.4, -4.6, 8.9);
  ring.bezierCurveTo(-4.6, 6.6, -3.4, 4.6, 0, 4.6);
  tabShape.holes.push(ring);
  const tab = new THREE.Mesh(new THREE.ExtrudeGeometry(tabShape, {
    depth: 0.35, bevelEnabled: true, bevelThickness: 0.28, bevelSize: 0.32, bevelSegments: 4, curveSegments: 40,
  }), tabMat);
  tab.rotation.x = -Math.PI / 2;
  tab.position.set(0, 117.05, 0.4);
  canModel.add(tab);
  const rivet = new THREE.Mesh(new THREE.SphereGeometry(2.1, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2), tabMat);
  rivet.scale.y = 0.45;
  rivet.position.set(0, 117.6, 0);
  canModel.add(rivet);

  canModel.traverse(o => { if (o.isMesh) o.castShadow = true; });

  const canSpin = new THREE.Group();
  canSpin.add(canModel);
  const canPivot = new THREE.Group();
  canPivot.add(canSpin);
  canPivot.position.set(0, 1.7, 0);
  scene.add(canPivot);

  // ---------- Fondo infinito liso (ciclorama de estudio) ----------
  const clothColor = new THREE.Color('#4a2436');
  function buildCloth() {
    const NU = 2, NV = 240, W = 44;
    const zFront = 9, wallZ = -6.2, R = 3.4, H = 16;
    const F = zFront - (wallZ + R);
    const A = Math.PI * R / 2;
    const L = F + A + H;
    const pos = new Float32Array((NU + 1) * (NV + 1) * 3);
    let p = 0;
    for (let j = 0; j <= NV; j++) {
      const s = (j / NV) * L;
      let y, z;
      if (s <= F) { y = 0; z = zFront - s; }
      else if (s <= F + A) {
        const th = (s - F) / R;
        y = R - R * Math.cos(th); z = (wallZ + R) - R * Math.sin(th);
      } else { y = R + (s - F - A); z = wallZ; }
      for (let i = 0; i <= NU; i++) {
        pos[p++] = (i / NU - 0.5) * W; pos[p++] = y; pos[p++] = z;
      }
    }
    const idx = [];
    for (let j = 0; j < NV; j++) {
      for (let i = 0; i < NU; i++) {
        const a = j * (NU + 1) + i, b = a + 1, c = a + (NU + 1), d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  const clothMat = new THREE.MeshStandardMaterial({
    color: clothColor,
    roughness: 0.92,
    metalness: 0,
    envMapIntensity: 0.2,
    side: THREE.DoubleSide,
  });
  const cloth = new THREE.Mesh(buildCloth(), clothMat);
  cloth.receiveShadow = true;
  scene.add(cloth);

  // ---------- Luces ----------
  const canTarget = new THREE.Object3D();
  canTarget.position.set(0, 1.7, 0);
  scene.add(canTarget);

  function spot(angle, penumbra, shadow) {
    const l = new THREE.SpotLight(0xffffff, 1, 0, angle, penumbra, 1);
    l.target = canTarget;
    if (shadow) {
      l.castShadow = true;
      l.shadow.mapSize.set(2048, 2048);
      l.shadow.bias = -0.0002;
      l.shadow.radius = 14;
      l.shadow.blurSamples = 24;
      l.shadow.camera.near = 1;
      l.shadow.camera.far = 30;
    }
    scene.add(l);
    return l;
  }
  const key = spot(0.42, 0.85, true);
  const rimL = spot(0.35, 0.6, false);
  const rimR = spot(0.35, 0.6, false);
  const back = new THREE.SpotLight(0xffffff, 1, 0, 0.62, 1, 1);
  back.position.set(0, 0.5, -1.6);
  back.target.position.set(0, 3.4, -6.2);
  scene.add(back, back.target);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 0.2);
  scene.add(hemi);

  // ---------- Entorno para los reflejos del aluminio ----------
  const pmrem = new THREE.PMREMGenerator(renderer);
  let envRT = null;
  // textura de softbox: centro parejo y caída suave hacia los bordes
  const softbox = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const x = c.getContext('2d');
    const img = x.createImageData(128, 128);
    for (let py = 0; py < 128; py++) {
      for (let px = 0; px < 128; px++) {
        const u = Math.abs(px / 63.5 - 1), v = Math.abs(py / 63.5 - 1);
        const e = (1 - THREE.MathUtils.smoothstep(u, 0.6, 1)) * (1 - THREE.MathUtils.smoothstep(v, 0.75, 1));
        const k = (py * 128 + px) * 4;
        img.data[k] = img.data[k + 1] = img.data[k + 2] = e * 255;
        img.data[k + 3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
    return new THREE.CanvasTexture(c);
  })();
  function buildEnv(e) {
    const s = new THREE.Scene();
    s.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16),
      new THREE.MeshBasicMaterial({ color: e.base, side: THREE.BackSide })));
    const panel = (w, h, color, mult, at) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ map: softbox, color: new THREE.Color(color).multiplyScalar(mult), side: THREE.DoubleSide }));
      m.position.set(...at);
      m.lookAt(0, at[1] * 0.3, 0);
      s.add(m);
    };
    panel(1.6, 11, e.l, 5, [-6.5, 1.5, -2]);     // tira trasera izquierda: filo de luz
    panel(1.6, 11, e.r, 5, [6.5, 1.5, -2]);      // tira trasera derecha
    panel(1.4, 10, e.top, 3.2, [-4.2, 1.5, 7]);  // tira delantera: el brillo vertical clásico
    panel(9, 9, e.top, 1.6, [0, 10, 0.5]);       // softbox cenital
    panel(7, 4, e.top, 0.35, [3.5, 0.5, 8]);     // rebote de relleno
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(e.base).multiplyScalar(2.2), side: THREE.DoubleSide }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -4;
    s.add(floor);  // piso del estudio que rebota un poco de luz desde abajo
    const rt = pmrem.fromScene(s, 0.012);
    if (envRT) envRT.dispose();
    envRT = rt;
    scene.environment = rt.texture;
  }

  // ---------- Puestas de luz ----------
  const PRESETS = {
    estudio: {
      key: { color: '#ffe6d2', i: 2.3, pos: [-4.2, 6, 4.2] },
      rimL: { color: '#ff4f9a', i: 3.2, pos: [-3.6, 3.2, -3] },
      rimR: { color: '#d4e0ff', i: 2.4, pos: [3.6, 2.6, -2.6] },
      back: { color: '#ff7fb0', i: 2.2 },
      hemi: { sky: '#ffd8e8', ground: '#1a0a12', i: 0.22 },
      fog: '#140a10', cloth: '#4a2436', exposure: 1.1,
      env: { base: '#160b11', l: '#fff1e6', r: '#ff8cba', top: '#ffe9f1' },
    },
    neon: {
      key: { color: '#b9a8ff', i: 0.9, pos: [4, 5.5, 4] },
      rimL: { color: '#ff2d95', i: 6, pos: [-3.4, 2.2, -2.4] },
      rimR: { color: '#2fe3ff', i: 5.2, pos: [3.4, 2.8, -2.4] },
      back: { color: '#7b2dff', i: 3.2 },
      hemi: { sky: '#6f4bff', ground: '#0a0416', i: 0.14 },
      fog: '#0b0614', cloth: '#2f1d40', exposure: 1.15,
      env: { base: '#07040d', l: '#ff2d95', r: '#2fe3ff', top: '#5a3cff' },
    },
    atardecer: {
      key: { color: '#ffae66', i: 2.8, pos: [-6.2, 2.3, 3.2] },
      rimL: { color: '#ffd27a', i: 2.2, pos: [-3.2, 3.6, -3] },
      rimR: { color: '#ff6a8a', i: 1.9, pos: [3.8, 2, -2] },
      back: { color: '#ff8a4c', i: 2.1 },
      hemi: { sky: '#ffcf9e', ground: '#1c0c08', i: 0.28 },
      fog: '#1a0d0a', cloth: '#56272c', exposure: 1.05,
      env: { base: '#1a0d08', l: '#ffb36b', r: '#ff6a8a', top: '#ffe0b8' },
    },
  };

  function capture() {
    const L = l => ({ color: l.color.clone(), i: l.intensity, pos: l.position.toArray() });
    return {
      key: L(key), rimL: L(rimL), rimR: L(rimR),
      back: { color: back.color.clone(), i: back.intensity },
      hemi: { sky: hemi.color.clone(), ground: hemi.groundColor.clone(), i: hemi.intensity },
      fog: scene.fog.color.clone(), cloth: clothMat.color.clone(),
      exposure: renderer.toneMappingExposure,
    };
  }
  const C = v => (v instanceof THREE.Color ? v : new THREE.Color(v));
  const lerp = (a, b, t) => a + (b - a) * t;
  function apply(from, to, t) {
    for (const [name, l] of [['key', key], ['rimL', rimL], ['rimR', rimR]]) {
      l.color.lerpColors(C(from[name].color), C(to[name].color), t);
      l.intensity = lerp(from[name].i, to[name].i, t);
      l.position.set(...from[name].pos.map((v, k) => lerp(v, to[name].pos[k], t)));
    }
    back.color.lerpColors(C(from.back.color), C(to.back.color), t);
    back.intensity = lerp(from.back.i, to.back.i, t);
    hemi.color.lerpColors(C(from.hemi.sky), C(to.hemi.sky), t);
    hemi.groundColor.lerpColors(C(from.hemi.ground), C(to.hemi.ground), t);
    hemi.intensity = lerp(from.hemi.i, to.hemi.i, t);
    scene.fog.color.lerpColors(C(from.fog), C(to.fog), t);
    scene.background.copy(scene.fog.color);
    clothMat.color.lerpColors(C(from.cloth), C(to.cloth), t);
    renderer.toneMappingExposure = lerp(from.exposure, to.exposure, t);
  }

  let tween = null;
  function setPreset(name, instant) {
    const to = PRESETS[name];
    buildEnv(to.env);
    if (instant) { apply(to, to, 1); tween = null; }
    else tween = { from: capture(), to, start: performance.now(), dur: 1200 };
    document.querySelectorAll('[data-preset]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.preset === name)));
    document.body.style.background = to.fog;
  }
  document.querySelectorAll('[data-preset]').forEach(b =>
    b.addEventListener('click', () => setPreset(b.dataset.preset)));
  setPreset('estudio', true);

  // ---------- Giro / pausa ----------
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let spinning = !reduced;
  const spinBtn = document.getElementById('spin');
  function syncSpin() {
    spinBtn.innerHTML = spinning
      ? '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>'
      : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a1 1 0 0 0 1.5.86l9-5.5a1 1 0 0 0 0-1.72l-9-5.5A1 1 0 0 0 4 2.5z"/></svg>';
    spinBtn.setAttribute('aria-label', spinning ? 'Pausar giro' : 'Girar lata');
    spinBtn.setAttribute('aria-pressed', String(!spinning));
  }
  spinBtn.addEventListener('click', () => { spinning = !spinning; syncSpin(); });
  syncSpin();

  // ---------- Loop ----------
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // en pantallas angostas, alejar un poco para que la lata entre entera
    camera.fov = w / h < 0.75 ? 34 : 24;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();
  let t = 0, angle = 0.35;
  function frame(now) {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (spinning) { t += dt; angle += dt * 0.35; }
    canSpin.rotation.y = angle;
    canPivot.position.y = 1.7 + 0.09 * Math.sin(t * 0.9);
    canPivot.rotation.z = 0.16 + 0.035 * Math.sin(t * 0.6);
    canPivot.rotation.x = 0.06 * Math.sin(t * 0.45 + 1);
    canTarget.position.y = canPivot.position.y;

    if (tween) {
      const k = Math.min(1, (now - tween.start) / tween.dur);
      apply(tween.from, tween.to, k * k * (3 - 2 * k));
      if (k >= 1) tween = null;
    }

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
