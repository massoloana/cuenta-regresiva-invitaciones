<title>Lata Rosa</title>
<style>
  /* Layout: escena WebGL a pantalla completa; solo el selector de terminación, sin texto, flotando abajo. Look único rosa de estudio, a propósito. */
  :root {
    --bg: #f08bb0;
    --ink: #4a1027;
    --glass: rgba(255, 236, 243, 0.55);
    --line: rgba(120, 20, 60, 0.14);
    --accent: #b0165a;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* acabado fotográfico: viñeta muy leve y grano fino encima del render */
  .grade {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 75% at 50% 45%, rgba(90, 10, 40, 0) 60%, rgba(90, 10, 40, 0.16) 100%);
  }
  .grade::after {
    content: ""; position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .controls {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    max-width: calc(100% - 32px);
    display: flex;
    justify-content: center;
  }
  .seg {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 5px;
    gap: 8px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  button {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity .2s, box-shadow .2s;
  }
  button:hover { opacity: 0.9; }
  button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 2px #fff4f8, 0 0 0 4px var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .error {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding-inline: 24px; text-align: center; color: var(--ink);
  }
</style>

<div id="stage" aria-label="Dos latas apiladas en equilibrio sobre un fondo rosa de estudio"></div>

<div class="grade" aria-hidden="true"></div>

<div class="controls">
  <div class="seg" role="group" aria-label="Terminación de las latas">
    <button id="f-crema" data-finish="crema" aria-label="Crema mate" aria-pressed="true" style="background:#f3ead0"></button>
    <button id="f-aluminio" data-finish="aluminio" aria-label="Aluminio natural" aria-pressed="false" style="background:linear-gradient(100deg, #8d9299 0%, #d9dce0 35%, #ffffff 47%, #c9cdd2 58%, #7d828a 100%)"></button>
    <button id="f-mate" data-finish="mate" aria-label="Rosa oscuro mate" aria-pressed="false" style="background:#8f1247"></button>
    <button id="f-satinado" data-finish="satinado" aria-label="Rosa oscuro satinado" aria-pressed="false" style="background:radial-gradient(circle at 35% 30%, #d8578f, #8f1247 60%, #5e0a2f)"></button>
    <button id="f-metalizado" data-finish="metalizado" aria-label="Rosa oscuro metalizado" aria-pressed="false" style="background:linear-gradient(100deg, #4f0827 0%, #a3195a 35%, #ffd0e2 47%, #a3195a 58%, #4f0827 100%)"></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const stage = document.getElementById('stage');
  if (!window.THREE || !THREE.OrbitControls) {
    stage.innerHTML = '<div class="error">No se pudo cargar three.js. Recargá la página.</div>';
    return;
  }

  // ---------- Renderer, escena, cámara ----------
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    stage.innerHTML = '<div class="error">Este navegador no tiene WebGL activado, así que no puede mostrar la escena 3D.</div>';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  stage.appendChild(renderer.domElement);

  const lin = hex => new THREE.Color(hex).convertSRGBToLinear();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#e5809f');

  // Lente larga y cámara casi a la altura de la lata de abajo, como la foto
  const camera = new THREE.PerspectiveCamera(22, 1, 0.1, 120);
  camera.position.set(0, 1.7, 17);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2.55, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minDistance = 9;
  controls.maxDistance = 26;
  controls.minPolarAngle = 0.9;
  controls.maxPolarAngle = 1.64;
  controls.minAzimuthAngle = -0.9;
  controls.maxAzimuthAngle = 0.9;
  controls.update();

  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  // Ruido determinístico para las texturas procedurales
  function rng(seed) {
    return () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  }

  // Convierte un mapa de alturas en un normal map (tangente)
  function heightToNormal(h, w, hh, strength, wrapX) {
    const c = document.createElement('canvas');
    c.width = w; c.height = hh;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(w, hh);
    const at = (x, y) => {
      if (wrapX) x = (x + w) % w; else x = Math.max(0, Math.min(w - 1, x));
      y = Math.max(0, Math.min(hh - 1, y));
      return h[y * w + x];
    };
    for (let y = 0; y < hh; y++) {
      for (let x = 0; x < w; x++) {
        const dx = (at(x + 1, y) - at(x - 1, y)) * strength;
        const dy = (at(x, y + 1) - at(x, y - 1)) * strength;
        const len = Math.hypot(dx, dy, 1);
        const k = (y * w + x) * 4;
        img.data[k] = (-dx / len * 0.5 + 0.5) * 255;
        img.data[k + 1] = (dy / len * 0.5 + 0.5) * 255;
        img.data[k + 2] = (1 / len * 0.5 + 0.5) * 255;
        img.data[k + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = maxAniso;
    if (wrapX) t.wrapS = THREE.RepeatWrapping;
    return t;
  }

  // ---------- Lata (medidas en mm, escala 0.02) ----------
  // Perfil exterior completo: del centro del fondo abovedado hasta el borde del panel de la tapa
  const PROFILE = [
    [0, 9.6], [6, 9.4], [12, 8.5], [17, 6.7], [20.5, 4.5], [22.6, 2.3], [23.8, 0.7],
    [25, 0], [26.2, 0.45], [28, 2.3], [30.2, 5.1], [31.9, 8.1], [32.8, 10.8], [33, 12.8],
    [33, 30], [33, 60], [33, 90], [33, 107],
    [32.8, 109.6], [32.1, 113], [30.8, 116.6], [29.3, 119.8], [28.1, 122.1], [27.6, 123.4],
    [27.65, 125], [28, 127.4], [27.8, 129.2], [27.2, 130], [26.4, 129.9], [25.9, 129.1],
    [25.65, 127.4], [25.3, 125], [24.75, 123.6], [24.05, 123.15], [23.4, 123.55], [22.8, 124.6],
  ];
  const CAN_H = 130, FOOT_R = 25, SCALE = 0.02;
  const curve = new THREE.CatmullRomCurve3(PROFILE.map(([x, y]) => new THREE.Vector3(x, y, 0)), false, 'centripetal');
  const N = 700;
  const spaced = curve.getSpacedPoints(N - 1);
  const shellGeo = new THREE.LatheGeometry(spaced.map(p => new THREE.Vector2(p.x, p.y)), 220);

  // Zonas a lo largo del perfil: cuerpo y cuello (pintables), aluminio desnudo en fondo y costura
  const PAINT_FROM = 11.5, PAINT_TO = 121.4;
  const firstPaint = spaced.findIndex(p => p.y >= PAINT_FROM && p.x > 30);
  let lastPaint = firstPaint;
  for (let j = firstPaint; j < N && spaced[j].y <= PAINT_TO && spaced[j].x > 27.9; j++) lastPaint = j;
  const paintAt = j => {
    const soft = 3;
    const a = THREE.MathUtils.smoothstep(j, firstPaint - soft, firstPaint + soft);
    const b = 1 - THREE.MathUtils.smoothstep(j, lastPaint - soft, lastPaint + soft);
    return a * b;
  };

  // Texturas: u = vuelta a la lata, v = posición a lo largo del perfil (canvas fila 0 = arriba = v 1)
  const TW = 1024;
  const rowM = new Float32Array(N);
  for (let y = 0; y < N; y++) rowM[y] = paintAt(N - 1 - y);

  // Condensación: gotas de agua sobre el cuerpo, como la lata recién salida de la heladera
  const dropH = new Float32Array(TW * N);
  const dropM = new Float32Array(TW * N);
  (() => {
    const r = rng(5);
    const yMin = N - 1 - lastPaint + 6, yMax = N - 1 - firstPaint - 6;
    // 1 px de u ≈ 0.2 mm y 1 px de v ≈ 0.29 mm, así que las gotas se achatan en v para quedar redondas
    const add = (cx, cy, rad, stretch) => {
      const rx = rad, ry = rad * 0.7 * stretch;
      for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++) {
        if (y < 0 || y >= N) continue;
        for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
          const dx = (x - cx) / rx, dy = (y - cy) / ry;
          const d2 = dx * dx + dy * dy;
          if (d2 >= 1) continue;
          const k = y * TW + ((x % TW) + TW) % TW;
          const hgt = Math.sqrt(1 - d2) * rad * 0.5;
          if (hgt > dropH[k]) dropH[k] = hgt;
          dropM[k] = Math.max(dropM[k], Math.min(1, (1 - d2) * 5));
        }
      }
    };
    const place = () => [r() * TW, yMin + r() * (yMax - yMin)];
    for (let i = 0; i < 3400; i++) { const [x, y] = place(); add(x, y, 0.9 + r() * 1.6, 1); }
    for (let i = 0; i < 650; i++) { const [x, y] = place(); add(x, y, 2.4 + r() * 2.8, 1); }
    for (let i = 0; i < 60; i++) { const [x, y] = place(); add(x, y, 4.5 + r() * 4, 1.35); }
  })();

  // Relieve: anillos de torneado en fondo y costura, ondulación mínima, cepillado vertical y gotas
  function shellNormal(brush) {
    const h = new Float32Array(TW * N);
    const r = rng(11);
    const rings = new Float32Array(N);
    for (let j = 0; j < N; j++) rings[j] = r();
    const lines = new Float32Array(TW);
    for (let x = 0; x < TW; x++) lines[x] = r() * 0.7 + (r() > 0.93 ? 0.6 : 0);
    for (let y = 0; y < N; y++) {
      const j = N - 1 - y;
      const m = rowM[y];
      const bare = (1 - m) * (rings[y] * 0.6 + 0.4 * Math.sin(j * 2.1));
      for (let x = 0; x < TW; x++) {
        const u = x / TW * Math.PI * 2;
        const wobble = m * (0.35 * Math.sin(u * 3 + j * 0.011) + 0.2 * Math.sin(u * 7 + 1.3 + j * 0.02));
        const k = y * TW + x;
        h[k] = bare * 0.6 + wobble * 0.15 + m * lines[x] * 0.22 * brush + dropH[k];
      }
    }
    return heightToNormal(h, TW, N, 1.2, true);
  }
  const normalBrushed = shellNormal(1);   // aluminio sin pintar
  const normalPainted = shellNormal(0.2); // la pintura tapa casi todo el cepillado

  const colorCanvas = document.createElement('canvas');
  const pbrCanvas = document.createElement('canvas');
  colorCanvas.width = pbrCanvas.width = TW;
  colorCanvas.height = pbrCanvas.height = N;
  const cctx = colorCanvas.getContext('2d'), pctx = pbrCanvas.getContext('2d');
  const shellColor = new THREE.CanvasTexture(colorCanvas);
  shellColor.encoding = THREE.sRGBEncoding;
  const shellPbr = new THREE.CanvasTexture(pbrCanvas);
  for (const t of [shellColor, shellPbr]) { t.wrapS = THREE.RepeatWrapping; t.anisotropy = maxAniso; }

  // Terminaciones del cuerpo; el aluminio desnudo de fondo y costura siempre queda pulido y con laca
  const ALU = [0.86, 0.87, 0.89];
  const PINK = [0.62, 0.075, 0.30];
  const FINISHES = {
    crema: { color: [0.95, 0.92, 0.79], rough: 0.55, metal: 0.04, coat: 0 },   // pintura crema mate de la referencia
    aluminio: { color: ALU, rough: 0.24, metal: 1, coat: 0.5, brushed: true },  // sin pintar, cepillado
    mate: { color: PINK, rough: 0.62, metal: 0.08, coat: 0 },                  // soft-touch, sin brillo
    satinado: { color: PINK, rough: 0.42, metal: 0.35, coat: 0.35 },
    metalizado: { color: PINK, rough: 0.3, metal: 0.72, coat: 1 },             // tinta translúcida sobre aluminio, con laca
  };

  const shellMat = new THREE.MeshPhysicalMaterial({
    map: shellColor,
    roughnessMap: shellPbr,
    metalnessMap: shellPbr,
    clearcoatMap: shellPbr,
    roughness: 1,
    metalness: 1,
    clearcoat: 1,
    clearcoatRoughness: 0.04,
    normalMap: normalPainted,
    normalScale: new THREE.Vector2(0.5, 0.5),
    envMapIntensity: 1.1,
    side: THREE.DoubleSide,
  });

  function paintFinish(name) {
    const fin = FINISHES[name];
    const cImg = cctx.createImageData(TW, N);
    const pImg = pctx.createImageData(TW, N);
    for (let y = 0; y < N; y++) {
      const m = rowM[y];
      const rough = 0.17 + (fin.rough - 0.17) * m;
      const metal = 1 + (fin.metal - 1) * m;
      const coat = 1 + (fin.coat - 1) * m;
      const col = [0, 1, 2].map(ch => ALU[ch] + (fin.color[ch] - ALU[ch]) * m);
      for (let x = 0; x < TW; x++) {
        const k = y * TW + x;
        const d = dropM[k];  // el agua es lisa y brillante, y oscurece un poco la superficie
        const p = k * 4;
        cImg.data[p] = col[0] * (1 - 0.1 * d) * 255;
        cImg.data[p + 1] = col[1] * (1 - 0.1 * d) * 255;
        cImg.data[p + 2] = col[2] * (1 - 0.1 * d) * 255;
        cImg.data[p + 3] = 255;
        pImg.data[p] = (coat + (1 - coat) * d) * 255;      // R: clearcoat
        pImg.data[p + 1] = (rough + (0.04 - rough) * d) * 255; // G: roughness
        pImg.data[p + 2] = metal * 255;                    // B: metalness
        pImg.data[p + 3] = 255;
      }
    }
    cctx.putImageData(cImg, 0, 0);
    pctx.putImageData(pImg, 0, 0);
    shellColor.needsUpdate = true;
    shellPbr.needsUpdate = true;
    shellMat.normalMap = fin.brushed ? normalBrushed : normalPainted;
    document.querySelectorAll('[data-finish]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.finish === name)));
  }
  paintFinish('crema');
  document.querySelectorAll('[data-finish]').forEach(b =>
    b.addEventListener('click', () => paintFinish(b.dataset.finish)));

  // Tapa: aluminio con marcas concéntricas de estampado, panel de apertura, nervio en U y hueco para el dedo
  const LID_R = 22.8, LID_Y = 124.6;
  const lidNormal = (() => {
    const S = 1024;
    const h = new Float32Array(S * S);
    const r = rng(23);
    const rings = new Float32Array(S);
    for (let i = 0; i < S; i++) rings[i] = r();
    const bump = (d, w) => Math.exp(-(d * d) / (2 * w * w));
    for (let py = 0; py < S; py++) {
      for (let px = 0; px < S; px++) {
        // canvas → mm: x a la derecha, z hacia el frente (abajo del canvas)
        const x = (px / (S - 1) * 2 - 1) * LID_R;
        const z = (py / (S - 1) * 2 - 1) * LID_R;
        const rad = Math.hypot(x, z);
        let v = rings[Math.min(S - 1, Math.floor(rad / LID_R * S * 0.5))] * 0.08;
        v += 0.9 * bump(rad - 20.3, 0.45);                 // nervio perimetral
        v += 0.6 * bump(rad - 4.3, 0.5);                    // anillo alrededor del remache
        const f = Math.pow(Math.abs(x / 7.6), 2.6) + Math.pow(Math.abs((z - 10.6) / 7.2), 2.6);
        v += 0.35 * (1 - THREE.MathUtils.smoothstep(f, 0.85, 1.05)); // panel de apertura levemente elevado
        v -= 0.75 * bump(f - 1.06, 0.035);                  // línea de corte
        const fu = Math.pow(Math.abs(x / 10.4), 2.4) + Math.pow(Math.abs((z - 8.4) / 10), 2.4);
        v += 0.85 * bump(fu - 1, 0.05) * THREE.MathUtils.smoothstep(z, -3, 1); // nervio en U
        const g = Math.pow(x / 6.2, 2) + Math.pow((z + 10.4) / 4.4, 2);
        v -= 0.8 * (1 - THREE.MathUtils.smoothstep(g, 0.6, 1.2)); // hueco para el dedo
        h[py * S + px] = v;
      }
    }
    return heightToNormal(h, S, S, 2.4, false);
  })();
  const lidMat = new THREE.MeshPhysicalMaterial({
    color: 0xcfd3d8,
    metalness: 1,
    roughness: 0.27,
    normalMap: lidNormal,
    normalScale: new THREE.Vector2(0.6, 0.6),
    clearcoat: 0.5,
    clearcoatRoughness: 0.12,
    envMapIntensity: 1.1,
  });
  const tabMat = new THREE.MeshPhysicalMaterial({
    color: 0xd9dce0, metalness: 1, roughness: 0.2, clearcoat: 0.6, clearcoatRoughness: 0.08, envMapIntensity: 1.2,
  });

  // Anilla: cuerpo con nariz delantera, aro trasero y bordes redondeados
  const tabShape = new THREE.Shape();
  tabShape.moveTo(-4.2, -4.6);
  tabShape.quadraticCurveTo(0, -6.4, 4.2, -4.6);
  tabShape.bezierCurveTo(6.6, -2, 7.2, 4, 7.2, 8);
  tabShape.bezierCurveTo(7.2, 13.2, 4.2, 15.4, 0, 15.4);
  tabShape.bezierCurveTo(-4.2, 15.4, -7.2, 13.2, -7.2, 8);
  tabShape.bezierCurveTo(-7.2, 4, -6.6, -2, -4.2, -4.6);
  const ring = new THREE.Path();
  ring.moveTo(0, 4.6);
  ring.bezierCurveTo(3.4, 4.6, 4.6, 6.6, 4.6, 8.9);
  ring.bezierCurveTo(4.6, 11.4, 2.8, 12.6, 0, 12.6);
  ring.bezierCurveTo(-2.8, 12.6, -4.6, 11.4, -4.6, 8.9);
  ring.bezierCurveTo(-4.6, 6.6, -3.4, 4.6, 0, 4.6);
  tabShape.holes.push(ring);
  const tabGeo = new THREE.ExtrudeGeometry(tabShape, {
    depth: 0.35, bevelEnabled: true, bevelThickness: 0.28, bevelSize: 0.32, bevelSegments: 4, curveSegments: 40,
  });
  const lidGeo = new THREE.CircleGeometry(LID_R, 160);
  const rivetGeo = new THREE.SphereGeometry(2.1, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2);

  // Devuelve una lata con el origen en su centro; spinY la gira sobre su propio eje
  function makeCan(spinY) {
    const model = new THREE.Group();
    model.scale.setScalar(SCALE);
    model.position.y = -CAN_H / 2 * SCALE;
    model.rotation.y = spinY;
    model.add(new THREE.Mesh(shellGeo, shellMat));
    const lid = new THREE.Mesh(lidGeo, lidMat);
    lid.rotation.x = -Math.PI / 2;
    lid.position.y = LID_Y;
    model.add(lid);
    const tab = new THREE.Mesh(tabGeo, tabMat);
    tab.rotation.x = -Math.PI / 2;
    tab.position.set(0, LID_Y + 0.45, 0.4);
    model.add(tab);
    const rivet = new THREE.Mesh(rivetGeo, tabMat);
    rivet.scale.y = 0.45;
    rivet.position.set(0, LID_Y + 1, 0);
    model.add(rivet);
    model.traverse(o => { if (o.isMesh) o.castShadow = true; });
    const can = new THREE.Group();
    can.add(model);
    return { can, model };
  }

  // Lata de abajo, parada en el piso
  const lower = makeCan(0.7);
  lower.can.position.set(0, CAN_H / 2 * SCALE, 0);
  scene.add(lower.can);

  // Lata de arriba: inclinada hacia la izquierda y un poco hacia cámara, apoyada con el canto del fondo
  // sobre el borde izquierdo de la tapa de abajo
  const upper = makeCan(2.4);
  upper.can.rotation.set(0.2, 0, 0.52);
  scene.add(upper.can);
  (() => {
    upper.can.updateMatrixWorld(true);
    let low = null;
    for (let i = 0; i < 360; i++) {
      const a = i / 360 * Math.PI * 2;
      const p = upper.model.localToWorld(new THREE.Vector3(FOOT_R * Math.cos(a), 0, FOOT_R * Math.sin(a)));
      if (!low || p.y < low.y) low = p;
    }
    const contact = new THREE.Vector3(-0.53, CAN_H * SCALE + 0.004, 0);
    upper.can.position.add(contact.sub(low));
  })();

  // ---------- Fondo rosa de estudio: piso claro que sube en curva suave a una pared más intensa ----------
  const FLOOR = lin('#f9c3d3'), WALL = lin('#f27ea6');
  function buildSweep() {
    const NU = 2, NV = 260, W = 70;
    const zFront = 14, wallZ = -7, R = 1.4, H = 34;
    const F = zFront - (wallZ + R);
    const A = Math.PI * R / 2;
    const L = F + A + H;
    const pos = new Float32Array((NU + 1) * (NV + 1) * 3);
    const col = new Float32Array((NU + 1) * (NV + 1) * 3);
    const c = new THREE.Color();
    let p = 0, q = 0;
    for (let j = 0; j <= NV; j++) {
      const s = (j / NV) * L;
      let y, z;
      if (s <= F) { y = 0; z = zFront - s; }
      else if (s <= F + A) {
        const th = (s - F) / R;
        y = R - R * Math.cos(th); z = (wallZ + R) - R * Math.sin(th);
      } else { y = R + (s - F - A); z = wallZ; }
      c.copy(FLOOR).lerp(WALL, THREE.MathUtils.smoothstep(s, F - 1, F + A + 1.5));
      for (let i = 0; i <= NU; i++) {
        pos[p++] = (i / NU - 0.5) * W; pos[p++] = y; pos[p++] = z;
        col[q++] = c.r; col[q++] = c.g; col[q++] = c.b;
      }
    }
    const idx = [];
    for (let j = 0; j < NV; j++) {
      for (let i = 0; i < NU; i++) {
        const a = j * (NU + 1) + i, b = a + 1, cc = a + (NU + 1), d = cc + 1;
        idx.push(a, cc, b, b, cc, d);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  const sweep = new THREE.Mesh(buildSweep(), new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.95, metalness: 0, envMapIntensity: 0.35, side: THREE.DoubleSide,
  }));
  sweep.receiveShadow = true;
  scene.add(sweep);

  // Oclusión de contacto: la sombrita oscura justo donde la lata toca el piso
  const contactTex = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,255,255,0.75)');
    g.addColorStop(0.45, 'rgba(255,255,255,0.45)');
    g.addColorStop(0.62, 'rgba(255,255,255,0.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })();
  const contactShadow = new THREE.Mesh(new THREE.PlaneGeometry(1.75, 1.75), new THREE.MeshBasicMaterial({
    map: contactTex, color: lin('#7a2142'), transparent: true, depthWrite: false,
  }));
  contactShadow.rotation.x = -Math.PI / 2;
  contactShadow.position.y = 0.003;
  scene.add(contactShadow);

  // ---------- Luz: un softbox grande arriba a la derecha y relleno rosa del propio estudio ----------
  const key = new THREE.DirectionalLight(lin('#fff6f2'), 1.05);
  key.position.set(3.2, 9, 7);
  key.target.position.set(0, 1.6, 0);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -4, right: 4, top: 5, bottom: -4, near: 1, far: 30 });
  key.shadow.bias = -0.0002;
  key.shadow.radius = 18;
  key.shadow.blurSamples = 25;
  scene.add(key, key.target);
  scene.add(new THREE.HemisphereLight(lin('#ffe9f1'), lin('#f4a3c0'), 0.55));

  // Entorno para los reflejos: estudio rosa con softboxes de bordes suaves
  const softbox = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const x = c.getContext('2d');
    const img = x.createImageData(128, 128);
    for (let py = 0; py < 128; py++) {
      for (let px = 0; px < 128; px++) {
        const u = Math.abs(px / 63.5 - 1), v = Math.abs(py / 63.5 - 1);
        const e = (1 - THREE.MathUtils.smoothstep(u, 0.6, 1)) * (1 - THREE.MathUtils.smoothstep(v, 0.75, 1));
        const k = (py * 128 + px) * 4;
        img.data[k] = img.data[k + 1] = img.data[k + 2] = e * 255;
        img.data[k + 3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
    return new THREE.CanvasTexture(c);
  })();
  (() => {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const s = new THREE.Scene();
    s.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16),
      new THREE.MeshBasicMaterial({ color: WALL.clone().multiplyScalar(0.9), side: THREE.BackSide })));
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
      new THREE.MeshBasicMaterial({ color: FLOOR.clone().multiplyScalar(1.1), side: THREE.DoubleSide }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2;
    s.add(floor);
    const panel = (w, h, mult, at) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ map: softbox, color: new THREE.Color(1, 0.97, 0.96).multiplyScalar(mult), side: THREE.DoubleSide }));
      m.position.set(...at);
      m.lookAt(0, at[1] * 0.3, 0);
      s.add(m);
    };
    panel(7, 9, 3.2, [4.5, 6, 6]);     // softbox principal
    panel(1.5, 10, 2.2, [-5.5, 2, 3]); // tira de la izquierda: el brillo vertical en el borde
    panel(1.5, 10, 1.6, [6, 2, -3]);   // contra suave
    panel(8, 8, 1.4, [0, 10, 0]);      // cenital
    scene.environment = pmrem.fromScene(s, 0.012).texture;
    pmrem.dispose();
  })();

  // ---------- Loop ----------
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // en pantallas angostas, abrir un poco el lente para que entren las dos latas
    camera.fov = w / h < 0.75 ? 30 : 22;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  function frame() {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
