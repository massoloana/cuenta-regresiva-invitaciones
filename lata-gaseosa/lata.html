<title>Lata Rosa</title>
<style>
  /* Layout: escena WebGL a pantalla completa, solo controles de luz sin texto flotando abajo. Look oscuro único, a propósito. */
  :root {
    --bg: #140a10;
    --ink: #f7eaf0;
    --muted: #c7a5b5;
    --glass: rgba(30, 12, 22, 0.58);
    --line: rgba(255, 210, 228, 0.16);
    --accent: #ff5c9d;
        color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .controls {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    max-width: calc(100% - 32px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .seg {
    display: flex;
    padding: 5px;
    gap: 8px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  button {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    color: var(--muted);
    background: transparent;
    display: grid;
    place-items: center;
    transition: color .2s, box-shadow .2s;
  }
  .dot { background: linear-gradient(135deg, var(--c1), var(--c2)); opacity: 0.55; }
  .dot:hover { opacity: 0.85; }
  .dot[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  .icon { width: 44px; height: 44px; }
  .icon:hover { color: var(--ink); }
  .icon svg { width: 16px; height: 16px; fill: currentColor; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .solo {
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .error {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding-inline: 24px; text-align: center; color: var(--muted);
  }
</style>

<div id="stage" aria-label="Lata de gaseosa en 3D flotando sobre una tela"></div>

<div class="controls">
  <div class="seg" role="group" aria-label="Iluminación">
    <button id="p-estudio" class="dot" data-preset="estudio" aria-label="Luz de estudio" aria-pressed="true" style="--c1:#ffe6d2;--c2:#ff4f9a"></button>
    <button id="p-neon" class="dot" data-preset="neon" aria-label="Luz neón" aria-pressed="false" style="--c1:#ff2d95;--c2:#2fe3ff"></button>
    <button id="p-atardecer" class="dot" data-preset="atardecer" aria-label="Luz de atardecer" aria-pressed="false" style="--c1:#ffae66;--c2:#ff6a8a"></button>
  </div>
  <button id="spin" class="solo icon" aria-label="Pausar giro" aria-pressed="false"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const stage = document.getElementById('stage');
  if (!window.THREE || !THREE.OrbitControls) {
    stage.innerHTML = '<div class="error">No se pudo cargar three.js. Recargá la página.</div>';
    return;
  }

  // ---------- Renderer, escena, cámara ----------
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    stage.innerHTML = '<div class="error">Este navegador no tiene WebGL activado, así que no puede mostrar la escena 3D.</div>';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#140a10');
  scene.fog = new THREE.FogExp2('#140a10', 0.05);

  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 2.1, 7.6);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.65, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minDistance = 4;
  controls.maxDistance = 12;
  controls.minPolarAngle = 0.55;
  controls.maxPolarAngle = 1.52;
  controls.minAzimuthAngle = -1.1;
  controls.maxAzimuthAngle = 1.1;
  controls.update();

  // ---------- Lata (medidas en mm, escala 0.02) ----------
  const alu = new THREE.MeshStandardMaterial({ color: 0xd8dbe0, metalness: 1, roughness: 0.2, side: THREE.DoubleSide });
  const aluLid = new THREE.MeshStandardMaterial({ color: 0xc6cad0, metalness: 1, roughness: 0.3, side: THREE.DoubleSide });
  // Etiqueta lisa: pintura rosa oscuro sobre aluminio, con laca
  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: '#a01a55',
    metalness: 0.55,
    roughness: 0.32,
    clearcoat: 0.7,
    clearcoatRoughness: 0.08,
  });

  const lathe = (pts, mat) => new THREE.Mesh(
    new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), 160), mat);

  const canModel = new THREE.Group();
  canModel.scale.setScalar(0.02);
  canModel.position.y = -60 * 0.02;

  const body = new THREE.Mesh(new THREE.CylinderGeometry(33, 33, 88, 180, 1, true), bodyMat);
  body.position.y = 56;
  canModel.add(body);

  canModel.add(lathe([
    [0, 8], [10, 7.4], [17, 5.8], [21.5, 3.2], [23.5, 1], [24.5, 0], [26, 0.4],
    [28, 2], [30.5, 5], [32.4, 9], [33, 12],
  ], alu));

  canModel.add(lathe([
    [33, 100], [32.7, 103.5], [31.6, 107.5], [29.6, 111.5], [28, 114.6], [27.4, 116.6],
    [27.6, 118.4], [27.1, 119.6], [26.2, 119.9], [25.5, 119.3], [25.2, 117.5], [24.8, 116.4],
    [23.5, 116], [0, 116],
  ], aluLid));

  const groove = new THREE.Mesh(new THREE.TorusGeometry(21.6, 0.35, 8, 140), aluLid);
  groove.rotation.x = Math.PI / 2;
  groove.position.y = 116.05;
  canModel.add(groove);

  // Anilla
  const tabShape = new THREE.Shape();
  (function () {
    const x0 = -6.5, x1 = 6.5, y0 = -5, y1 = 15, r = 5;
    tabShape.moveTo(x0 + r, y0);
    tabShape.lineTo(x1 - r, y0);
    tabShape.quadraticCurveTo(x1, y0, x1, y0 + r);
    tabShape.lineTo(x1, y1 - r);
    tabShape.quadraticCurveTo(x1, y1, x1 - r, y1);
    tabShape.lineTo(x0 + r, y1);
    tabShape.quadraticCurveTo(x0, y1, x0, y1 - r);
    tabShape.lineTo(x0, y0 + r);
    tabShape.quadraticCurveTo(x0, y0, x0 + r, y0);
    const hole = new THREE.Path();
    hole.absellipse(0, 8.6, 4.2, 3.1, 0, Math.PI * 2, false, 0);
    tabShape.holes.push(hole);
  })();
  const tab = new THREE.Mesh(new THREE.ExtrudeGeometry(tabShape, {
    depth: 0.4, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.25, bevelSegments: 2, curveSegments: 24,
  }), alu);
  tab.rotation.x = -Math.PI / 2;
  tab.position.set(0, 116.35, -1);
  canModel.add(tab);
  const rivet = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.6, 1.1, 28), aluLid);
  rivet.position.set(0, 116.5, 0);
  canModel.add(rivet);

  canModel.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  const canSpin = new THREE.Group();
  canSpin.add(canModel);
  const canPivot = new THREE.Group();
  canPivot.add(canSpin);
  canPivot.position.set(0, 1.7, 0);
  scene.add(canPivot);

  // ---------- Fondo infinito liso (ciclorama de estudio) ----------
  const clothColor = new THREE.Color('#4a2436');
  function buildCloth() {
    const NU = 2, NV = 240, W = 44;
    const zFront = 9, wallZ = -6.2, R = 3.4, H = 16;
    const F = zFront - (wallZ + R);
    const A = Math.PI * R / 2;
    const L = F + A + H;
    const pos = new Float32Array((NU + 1) * (NV + 1) * 3);
    let p = 0;
    for (let j = 0; j <= NV; j++) {
      const s = (j / NV) * L;
      let y, z;
      if (s <= F) { y = 0; z = zFront - s; }
      else if (s <= F + A) {
        const th = (s - F) / R;
        y = R - R * Math.cos(th); z = (wallZ + R) - R * Math.sin(th);
      } else { y = R + (s - F - A); z = wallZ; }
      for (let i = 0; i <= NU; i++) {
        pos[p++] = (i / NU - 0.5) * W; pos[p++] = y; pos[p++] = z;
      }
    }
    const idx = [];
    for (let j = 0; j < NV; j++) {
      for (let i = 0; i < NU; i++) {
        const a = j * (NU + 1) + i, b = a + 1, c = a + (NU + 1), d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  const clothMat = new THREE.MeshStandardMaterial({
    color: clothColor,
    roughness: 0.92,
    metalness: 0,
    envMapIntensity: 0.2,
    side: THREE.DoubleSide,
  });
  const cloth = new THREE.Mesh(buildCloth(), clothMat);
  cloth.receiveShadow = true;
  scene.add(cloth);

  // ---------- Luces ----------
  const canTarget = new THREE.Object3D();
  canTarget.position.set(0, 1.7, 0);
  scene.add(canTarget);

  function spot(angle, penumbra, shadow) {
    const l = new THREE.SpotLight(0xffffff, 1, 0, angle, penumbra, 1);
    l.target = canTarget;
    if (shadow) {
      l.castShadow = true;
      l.shadow.mapSize.set(2048, 2048);
      l.shadow.bias = -0.0004;
      l.shadow.normalBias = 0.02;
      l.shadow.camera.near = 1;
      l.shadow.camera.far = 30;
    }
    scene.add(l);
    return l;
  }
  const key = spot(0.42, 0.85, true);
  const rimL = spot(0.35, 0.6, false);
  const rimR = spot(0.35, 0.6, false);
  const back = new THREE.SpotLight(0xffffff, 1, 0, 0.62, 1, 1);
  back.position.set(0, 0.5, -1.6);
  back.target.position.set(0, 3.4, -6.2);
  scene.add(back, back.target);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 0.2);
  scene.add(hemi);

  // ---------- Entorno para los reflejos del aluminio ----------
  const pmrem = new THREE.PMREMGenerator(renderer);
  let envRT = null;
  function buildEnv(e) {
    const s = new THREE.Scene();
    s.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16),
      new THREE.MeshBasicMaterial({ color: e.base, side: THREE.BackSide })));
    const panel = (w, h, color, mult, at) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(mult), side: THREE.DoubleSide }));
      m.position.set(...at);
      m.lookAt(0, 0, 0);
      s.add(m);
    };
    panel(2.2, 12, e.l, 4, [-7, 2, 3]);
    panel(2.2, 12, e.r, 4, [7, 1, -2]);
    panel(10, 4, e.top, 2.2, [0, 9, 1]);
    panel(14, 1.2, e.l, 1.4, [0, -3, 7]);
    const rt = pmrem.fromScene(s, 0.03);
    if (envRT) envRT.dispose();
    envRT = rt;
    scene.environment = rt.texture;
  }

  // ---------- Puestas de luz ----------
  const PRESETS = {
    estudio: {
      key: { color: '#ffe6d2', i: 2.3, pos: [-4.2, 6, 4.2] },
      rimL: { color: '#ff4f9a', i: 3.2, pos: [-3.6, 3.2, -3] },
      rimR: { color: '#d4e0ff', i: 2.4, pos: [3.6, 2.6, -2.6] },
      back: { color: '#ff7fb0', i: 2.2 },
      hemi: { sky: '#ffd8e8', ground: '#1a0a12', i: 0.22 },
      fog: '#140a10', cloth: '#4a2436', exposure: 1.1,
      env: { base: '#160b11', l: '#fff1e6', r: '#ff8cba', top: '#ffe9f1' },
    },
    neon: {
      key: { color: '#b9a8ff', i: 0.9, pos: [4, 5.5, 4] },
      rimL: { color: '#ff2d95', i: 6, pos: [-3.4, 2.2, -2.4] },
      rimR: { color: '#2fe3ff', i: 5.2, pos: [3.4, 2.8, -2.4] },
      back: { color: '#7b2dff', i: 3.2 },
      hemi: { sky: '#6f4bff', ground: '#0a0416', i: 0.14 },
      fog: '#0b0614', cloth: '#2f1d40', exposure: 1.15,
      env: { base: '#07040d', l: '#ff2d95', r: '#2fe3ff', top: '#5a3cff' },
    },
    atardecer: {
      key: { color: '#ffae66', i: 2.8, pos: [-6.2, 2.3, 3.2] },
      rimL: { color: '#ffd27a', i: 2.2, pos: [-3.2, 3.6, -3] },
      rimR: { color: '#ff6a8a', i: 1.9, pos: [3.8, 2, -2] },
      back: { color: '#ff8a4c', i: 2.1 },
      hemi: { sky: '#ffcf9e', ground: '#1c0c08', i: 0.28 },
      fog: '#1a0d0a', cloth: '#56272c', exposure: 1.05,
      env: { base: '#1a0d08', l: '#ffb36b', r: '#ff6a8a', top: '#ffe0b8' },
    },
  };

  function capture() {
    const L = l => ({ color: l.color.clone(), i: l.intensity, pos: l.position.toArray() });
    return {
      key: L(key), rimL: L(rimL), rimR: L(rimR),
      back: { color: back.color.clone(), i: back.intensity },
      hemi: { sky: hemi.color.clone(), ground: hemi.groundColor.clone(), i: hemi.intensity },
      fog: scene.fog.color.clone(), cloth: clothMat.color.clone(),
      exposure: renderer.toneMappingExposure,
    };
  }
  const C = v => (v instanceof THREE.Color ? v : new THREE.Color(v));
  const lerp = (a, b, t) => a + (b - a) * t;
  function apply(from, to, t) {
    for (const [name, l] of [['key', key], ['rimL', rimL], ['rimR', rimR]]) {
      l.color.lerpColors(C(from[name].color), C(to[name].color), t);
      l.intensity = lerp(from[name].i, to[name].i, t);
      l.position.set(...from[name].pos.map((v, k) => lerp(v, to[name].pos[k], t)));
    }
    back.color.lerpColors(C(from.back.color), C(to.back.color), t);
    back.intensity = lerp(from.back.i, to.back.i, t);
    hemi.color.lerpColors(C(from.hemi.sky), C(to.hemi.sky), t);
    hemi.groundColor.lerpColors(C(from.hemi.ground), C(to.hemi.ground), t);
    hemi.intensity = lerp(from.hemi.i, to.hemi.i, t);
    scene.fog.color.lerpColors(C(from.fog), C(to.fog), t);
    scene.background.copy(scene.fog.color);
    clothMat.color.lerpColors(C(from.cloth), C(to.cloth), t);
    renderer.toneMappingExposure = lerp(from.exposure, to.exposure, t);
  }

  let tween = null;
  function setPreset(name, instant) {
    const to = PRESETS[name];
    buildEnv(to.env);
    if (instant) { apply(to, to, 1); tween = null; }
    else tween = { from: capture(), to, start: performance.now(), dur: 1200 };
    document.querySelectorAll('[data-preset]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.preset === name)));
    document.body.style.background = to.fog;
  }
  document.querySelectorAll('[data-preset]').forEach(b =>
    b.addEventListener('click', () => setPreset(b.dataset.preset)));
  setPreset('estudio', true);

  // ---------- Giro / pausa ----------
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let spinning = !reduced;
  const spinBtn = document.getElementById('spin');
  function syncSpin() {
    spinBtn.innerHTML = spinning
      ? '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>'
      : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a1 1 0 0 0 1.5.86l9-5.5a1 1 0 0 0 0-1.72l-9-5.5A1 1 0 0 0 4 2.5z"/></svg>';
    spinBtn.setAttribute('aria-label', spinning ? 'Pausar giro' : 'Girar lata');
    spinBtn.setAttribute('aria-pressed', String(!spinning));
  }
  spinBtn.addEventListener('click', () => { spinning = !spinning; syncSpin(); });
  syncSpin();

  // ---------- Loop ----------
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // en pantallas angostas, alejar un poco para que la lata entre entera
    camera.fov = w / h < 0.75 ? 42 : 32;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();
  let t = 0, angle = 0.35;
  function frame(now) {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (spinning) { t += dt; angle += dt * 0.35; }
    canSpin.rotation.y = angle;
    canPivot.position.y = 1.7 + 0.09 * Math.sin(t * 0.9);
    canPivot.rotation.z = 0.16 + 0.035 * Math.sin(t * 0.6);
    canPivot.rotation.x = 0.06 * Math.sin(t * 0.45 + 1);
    canTarget.position.y = canPivot.position.y;

    if (tween) {
      const k = Math.min(1, (now - tween.start) / tween.dur);
      apply(tween.from, tween.to, k * k * (3 - 2 * k));
      if (k >= 1) tween = null;
    }

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
